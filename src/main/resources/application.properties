# --- Datasource (Supabase, Session Pooler) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

# --- JWT (RNF-01, RNF-02) ---
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=1800000

supabase.url=${SUPABASE_URL}
supabase.service-key=${SUPABASE_SERVICE_KEY}
supabase.bucket=publicaciones-imagenes

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Correo (RF-03, RF-33): SMTP de Brevo ---
spring.mail.host=smtp-relay.sendinblue.com
spring.mail.port=587
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
correo.remitente=${MAIL_REMITENTE:}

# --- Pagos simulados (RF-35): Stripe en modo test ---
stripe.secret-key=${STRIPE_SECRET_KEY:}
