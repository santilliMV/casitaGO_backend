name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

jobs:
  build-and-analyze:
    name: Build, test y análisis estático
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # SonarQube Cloud necesita el historial completo para un análisis correcto,
          # no solo el último commit.
          fetch-depth: 0

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cachear análisis de SonarQube Cloud
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build + pruebas + análisis SonarQube Cloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # TODO: reemplaza TU_ORGANIZACION y TU_PROJECT_KEY por los valores exactos
        # que te muestra SonarQube Cloud al crear el proyecto (paso "Set up" -> "With GitHub Actions").
        run: >
          ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.organization=TU_ORGANIZACION
          -Dsonar.projectKey=TU_PROJECT_KEY
          -Dsonar.host.url=https://sonarcloud.io
